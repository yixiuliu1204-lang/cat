<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="" />
    <link rel="stylesheet" href="css/登录.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css" rel="stylesheet">
    <link href="css/bootstrap.css" rel="stylesheet" type="text/css" media="all" />
    <title>登录</title>
  </head>
  <body>
    <div class="backg">
      <div class="all-p"> 
        <img src="images/maowologo.png" alt="" height="180" width="180">
        <div id="page" class="site">
          <div class="container1">
            <div class="login">
              <div class="hero">
                <h1>欢迎来到<br>
                  猫窝CatMe
                </h1>
                <p>如果你没有账号<br>
                  可以<a href="#">点击这里</a>
                    进行注册.
                </p>
              </div>
              <div class="main">
                <form action="">
                  <p>
                    <input type="email" placeholder="邮箱">
                  </p>
                  <p class="password">
                    <input type="password" placeholder="密码">
                    <i class="ri-eye-off-line">
                    </i> 
                    <a href="#">找回密码</a> 
                  </p>
                  <p>
                    <input type="submit" class="submit" value="登录">
                  </p>
                </form>
                <div class="options">
                  <div class="separator">
                    <p>使用其他方式登录</p>
                  </div>
                  <!-- 图标需要连vpn显示 -->
                  <ul>
                    <li><a href="#"><i class="ri-qq-fill"></i></a></li>
                    <li><a href="#"><i class="ri-wechat-fill"></i></a></li>
                    <li><a href="#"><i class="ri-weibo-fill"></i></a></li>
                  </ul>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
